version: "3.9"

services:
  backend:
    build:
      context: ./backend/BookBuddy.Api
      dockerfile: Dockerfile.dev  # Brug Dockerfile.dev til udvikling
    ports:
      - "8081:80"  # Backend port mapping - matche porten med Dockerfile.dev
    volumes:
      - ./backend/BookBuddy.Api:/app
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=bookbuddydb;Username=postgres;Password=secret

  db:
    image: postgres:16
    container_name: bookbuddy-db
    ports:
      - "5432:5432"  # PostgreSQL port
    environment:
      POSTGRES_DB: bookbuddydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"  # Frontend port mapping
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  mobile:
    build:
      context: ./mobile
    ports:
      - "19000:19000"     # Metro bundler (default port)
      - "19001:19001"     # Metro websocket
      - "19002:19002"     # Expo dev tools (browser)
    volumes:
      - ./mobile:/app
    command: npx expo start --tunnel
    stdin_open: true
    tty: true
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0

volumes:
  pgdata:
